name: Deploy to GitHub Pages

# Builds the static site and publishes it to this repository's GitHub Pages.
# Enable it once under Settings → Pages → Build and deployment → Source:
# "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Builds through the vendoring path, which installs Framework's own npm
      # dependencies at pinned versions from the registry. The plain `build`
      # resolves them as `@latest` from a CDN, so the same commit could
      # produce different output on different days.
      - name: Build
        run: npm run build:offline
        env:
          OBSERVABLE_TELEMETRY_DISABLE: 'true'
          # A single page emits relative asset paths, so this is only needed
          # if the site ever grows a second page served under a sub-path.
          SITE_BASE: ${{ vars.SITE_BASE }}

      # Pages would otherwise run the output through Jekyll, which strips
      # the leading-underscore directories Framework emits.
      - name: Disable Jekyll
        run: touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
